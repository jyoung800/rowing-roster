services:
  rowing-roster:
    build: .
    container_name: rowing-roster
    restart: unless-stopped
    ports:
      - "8050:8050"
    environment:
      - ROLLER_CLIENT_ID=${ROLLER_CLIENT_ID}
      - ROLLER_CLIENT_SECRET=${ROLLER_CLIENT_SECRET}
      - ROLLER_VENUE_ID=${ROLLER_VENUE_ID}
      - DEMO_MODE=${DEMO_MODE:-false}
      - MEMBERSHIP_PLUS=${MEMBERSHIP_PLUS:-8565,8572,8573,8574,8575,8579,9528,9529,9530,9531,9547,9548,9549,9550}
      - LOOKBACK_DAYS=${LOOKBACK_DAYS:-180}
    volumes:
      # Persists the roster cache across container restarts/rebuilds so a NAS
      # reboot doesn't force a full multi-thousand-call Roller re-sync.
      - ./data:/app/data
